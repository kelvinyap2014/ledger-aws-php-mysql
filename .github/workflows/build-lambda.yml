name: Build TypeScript NestJS Lambda

on:
  push:
    branches: [ main ]
    paths:
      - 'app/lambda/settlement-handler/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/lambda/settlement-handler/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/lambda/settlement-handler

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/lambda/settlement-handler/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript / Bundle with esbuild
        run: npm run build
